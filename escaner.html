<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Golden Night — Escáner de entradas</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Prata&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink: #06030F;
    --gold: #FF2E9A;
    --gold-light: #FF8AD4;
    --blue: #29D9FF;
    --blue-light: #7FEBFF;
    --cream: #F6EEDC;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  body{
    background: var(--ink);
    color: var(--cream);
    font-family: 'Work Sans', sans-serif;
    min-height: 100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding: 30px 16px 60px;
  }
  h1{
    font-family:'Prata', serif;
    font-size: 26px;
    color: var(--gold-light);
    margin-bottom: 6px;
    text-align:center;
  }
  .subtitle{ font-size: 13px; color: rgba(246,238,220,0.55); margin-bottom: 30px; text-align:center; }

  /* GATE DE CONTRASEÑA */
  #gate{
    width: 100%; max-width: 360px;
    text-align:center;
  }
  #gate input{
    width: 100%;
    padding: 14px 16px;
    background: rgba(246,238,220,0.05);
    border: 1px solid rgba(255,46,154,0.35);
    color: var(--cream);
    font-size: 15px;
    text-align:center;
    letter-spacing: 0.1em;
    margin-bottom: 14px;
  }
  #gate button{
    width:100%;
    padding: 14px;
    background: linear-gradient(90deg, var(--gold-light), var(--blue-light));
    border: 1px solid var(--gold);
    color: #180620;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
  }
  #gate-error{ color: var(--gold-light); font-size: 12.5px; margin-top: 10px; min-height: 16px; }

  /* ESCÁNER */
  #scanner-app{ display:none; width: 100%; max-width: 420px; }
  #reader{
    width: 100%;
    border: 2px solid var(--gold-light);
    overflow:hidden;
  }
  #start-btn{
    width:100%;
    margin-top: 16px;
    padding: 15px;
    background: linear-gradient(90deg, var(--gold-light), var(--blue-light));
    border: 1px solid var(--gold);
    color: #180620;
    font-weight: 600;
    font-size: 15px;
    cursor: pointer;
  }

  #result{
    margin-top: 24px;
    padding: 24px;
    text-align:center;
    display:none;
    border: 2px solid;
  }
  #result.valid{ border-color: var(--blue); background: rgba(41,217,255,0.08); display:block; }
  #result.invalid{ border-color: var(--gold); background: rgba(255,46,154,0.08); display:block; }
  #result .verdict{ font-family:'Prata', serif; font-size: 26px; margin-bottom: 10px; }
  #result.valid .verdict{ color: var(--blue-light); }
  #result.invalid .verdict{ color: var(--gold-light); }
  #result .detail{ font-size: 14px; color: var(--cream); line-height: 1.6; }

  #scan-again{
    margin-top: 18px;
    width:100%;
    padding: 13px;
    background: transparent;
    border: 1px solid rgba(246,238,220,0.3);
    color: var(--cream);
    font-size: 13px;
    cursor: pointer;
    display:none;
  }

  #manual-entry{
    margin-top: 34px;
    padding-top: 24px;
    border-top: 1px solid rgba(246,238,220,0.15);
  }
  .manual-label{
    font-size: 12px;
    color: rgba(246,238,220,0.5);
    text-align:center;
    margin-bottom: 12px;
  }
  .manual-row{
    display:flex;
    gap: 8px;
  }
  #manual-code{
    flex:1;
    padding: 12px 14px;
    background: rgba(246,238,220,0.05);
    border: 1px solid rgba(255,46,154,0.35);
    color: var(--cream);
    font-size: 14px;
    text-transform: uppercase;
  }
  #manual-submit{
    padding: 12px 18px;
    background: linear-gradient(90deg, var(--gold-light), var(--blue-light));
    border: 1px solid var(--gold);
    color: #180620;
    font-weight: 600;
    font-size: 13px;
    cursor: pointer;
  }
</style>
</head>
<body>

  <h1>Golden Night</h1>
  <div class="subtitle">Escáner de entradas — solo personal autorizado</div>

  <div id="gate">
    <input type="password" id="gate-password" placeholder="Contraseña">
    <button id="gate-submit">Entrar</button>
    <div id="gate-error"></div>
  </div>

  <div id="scanner-app">
    <div id="reader"></div>
    <button id="start-btn">Activar cámara</button>
    <div id="result">
      <div class="verdict" id="result-verdict"></div>
      <div class="detail" id="result-detail"></div>
    </div>
    <button id="scan-again">Escanear otra entrada</button>

    <div id="manual-entry">
      <div class="manual-label">¿No lee el QR? Escribe el código a mano</div>
      <div class="manual-row">
        <input type="text" id="manual-code" placeholder="GN-XXXXXX">
        <button id="manual-submit">Comprobar</button>
      </div>
    </div>

    <pre id="debug-log" style="margin-top:24px;padding:12px;background:rgba(246,238,220,0.05);border:1px solid rgba(246,238,220,0.15);color:rgba(246,238,220,0.6);font-size:11px;white-space:pre-wrap;word-break:break-all;max-height:200px;overflow:auto;"></pre>
  </div>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
  // ⚠️ Cambia esta contraseña por la que quieras usar en la puerta
  const DOOR_PASSWORD = 'BLGNRD26';
  const TICKET_API_URL = 'https://script.google.com/macros/s/AKfycbwqCiy3NVIfCGasGLzsRDy91dTwyBOQEiBRzp7FjNSC0B5m8YPVP-IJlZwnITvvAlcGwA/exec';

  document.getElementById('gate-submit').addEventListener('click', function(){
    const val = document.getElementById('gate-password').value;
    if(val === DOOR_PASSWORD){
      document.getElementById('gate').style.display = 'none';
      document.getElementById('scanner-app').style.display = 'block';
    } else {
      document.getElementById('gate-error').textContent = 'Contraseña incorrecta';
    }
  });

  let html5QrCode;
  let scanning = false;

  function startScanner(){
    html5QrCode = new Html5Qrcode('reader');

    Html5Qrcode.getCameras().then(function(cameras){
      let cameraId = { facingMode: 'environment' };
      if(cameras && cameras.length){
        const backCam = cameras.find(function(c){
          return /back|rear|trasera|environment/i.test(c.label);
        });
        cameraId = backCam ? backCam.id : cameras[cameras.length - 1].id;
      }

      scanning = true;
      html5QrCode.start(
        cameraId,
        {
          fps: 10,
          qrbox: { width: 250, height: 250 },
          aspectRatio: 1.0,
          experimentalFeatures: { useBarCodeDetectorIfSupported: true }
        },
        onScanSuccess
      ).catch(function(){
        // Si falla con el id concreto, probamos con facingMode como respaldo
        html5QrCode.start(
          { facingMode: 'environment' },
          { fps: 10, qrbox: { width: 250, height: 250 } },
          onScanSuccess
        );
      });

      document.getElementById('start-btn').style.display = 'none';
    }).catch(function(){
      alert('No se pudo acceder a la cámara. Revisa que le hayas dado permiso en Ajustes → Safari → Cámara.');
    });
  }

  function stopScanner(){
    if(html5QrCode && scanning){
      html5QrCode.stop().then(function(){ scanning = false; });
    }
  }

  let alreadyHandled = false;

  function onScanSuccess(decodedText){
    if(alreadyHandled) return;
    alreadyHandled = true;
    stopScanner();
    verificar(decodedText.trim());
  }

  function log(msg){
    const el = document.getElementById('debug-log');
    const time = new Date().toLocaleTimeString();
    el.textContent += '[' + time + '] ' + msg + '\n';
    el.scrollTop = el.scrollHeight;
  }

  function jsonpRequest(url, onSuccess, onError){
    const callbackName = 'jsonpCallback_' + Date.now() + '_' + Math.floor(Math.random()*10000);
    const script = document.createElement('script');
    let finished = false;

    log('[JSONP] Solicitando: ' + url);

    const timeout = setTimeout(function(){
      if(finished) return;
      finished = true;
      log('[JSONP] TIMEOUT tras 25s sin respuesta');
      cleanup();
      onError();
    }, 25000);

    function cleanup(){
      clearTimeout(timeout);
      delete window[callbackName];
      if(script.parentNode) script.parentNode.removeChild(script);
    }

    window[callbackName] = function(data){
      if(finished) return;
      finished = true;
      log('[JSONP] Respuesta recibida: ' + JSON.stringify(data));
      cleanup();
      onSuccess(data);
    };

    script.src = url + (url.indexOf('?') > -1 ? '&' : '?') + 'callback=' + callbackName;
    script.onerror = function(){
      if(finished) return;
      finished = true;
      log('[JSONP] ERROR: el script no cargó (onerror disparado)');
      cleanup();
      onError();
    };
    log('[JSONP] Insertando script en la página…');
    document.body.appendChild(script);
  }

  function smartRequest(url, onSuccess, onError){
    log('[FETCH] Intentando fetch: ' + url);
    fetch(url)
      .then(function(res){ return res.json(); })
      .then(function(data){
        log('[FETCH] Respuesta recibida: ' + JSON.stringify(data));
        onSuccess(data);
      })
      .catch(function(err){
        log('[FETCH] Falló (' + err.message + '), probando con JSONP…');
        jsonpRequest(url, onSuccess, onError);
      });
  }

  function verificar(code){
    const url = TICKET_API_URL + '?action=verificar&code=' + encodeURIComponent(code);
    smartRequest(url, function(data){
      showResult(data.valid, data);
    }, function(){
      showResult(false, { reason: 'ERROR DE CONEXIÓN', name: '', ticketType: 'Puede que sí se haya registrado — revisa la Google Sheet si tienes dudas antes de dejar pasar dos veces' });
    });
  }

  function showResult(isValid, data){
    const resultEl = document.getElementById('result');
    const verdictEl = document.getElementById('result-verdict');
    const detailEl = document.getElementById('result-detail');

    resultEl.style.display = 'block';
    resultEl.style.borderColor = isValid ? '#29D9FF' : '#FF2E9A';
    resultEl.style.background = isValid ? 'rgba(41,217,255,0.08)' : 'rgba(255,46,154,0.08)';

    if(isValid){
      verdictEl.style.color = '#7FEBFF';
      verdictEl.textContent = '✅ VÁLIDA — ENTRADA LEÍDA';
      detailEl.textContent = (data.name || '') + ' — ' + (data.ticketType || '');
    } else {
      verdictEl.style.color = '#FF8AD4';
      verdictEl.textContent = '❌ ' + (data.reason || 'NO VÁLIDA').toUpperCase();
      if(data.name){
        detailEl.textContent = data.name + ' — ' + data.ticketType;
      } else if(data.ticketType){
        detailEl.textContent = data.ticketType;
      } else {
        detailEl.textContent = 'Código no reconocido';
      }
    }
    document.getElementById('scan-again').style.display = 'block';
  }

  document.getElementById('start-btn').addEventListener('click', startScanner);
  document.getElementById('scan-again').addEventListener('click', function(){
    alreadyHandled = false;
    document.getElementById('result').style.display = 'none';
    document.getElementById('scan-again').style.display = 'none';
    document.getElementById('start-btn').style.display = 'block';
  });

  document.getElementById('manual-submit').addEventListener('click', function(){
    const code = document.getElementById('manual-code').value.trim().toUpperCase();
    if(!code) return;
    verificar(code);
  });
</script>

</body>
</html>
